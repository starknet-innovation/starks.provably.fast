schema_version = "1.4"

[task]
name = "proven-mca/refute-fibre-alignment-m9"
version = "0.2.0"
description = "Refute fibre alignment on the subgroup of order 512: submit a pair and one exceptional challenge at k = 256, A = 320 whose agreement set holds no fibre-aligned anchor; the verifier certifies the challenge from the definition and classifies its agreement set. Reward 1 for one such challenge."
keywords = ["mathematics", "reed-solomon", "correlated-agreement", "proven-provably-fast", "T3", "upper-bound", "counterexample"]

[metadata]
source = "https://starks.provably.fast/"
statement = "https://starks.provably.fast/MATHEMATICS.md"
target = "T3"
family = "refute-fibre-alignment"
field = "babybear"
p = 2013265921
m = 9
n = 512
k = 256
A = 320
h = 32
level = 16
max_listed = 2048
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/workspace"
env = { m = "9" }

[verifier]
timeout_sec = 3600
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/proven/pack_instance.py"
timeout_sec = 120
