schema_version = "1.4"

[task]
name = "proven-mca/count-babybear-m$m"
version = "0.1.0"
description = "Find a line on the subgroup of order $n in BabyBear with as many bad challenges as possible at k = $k and agreement $A, certified from the definition; reward 1 only above 16 n, the count that would refute the pinned statement at this n."
keywords = ["mathematics", "reed-solomon", "correlated-agreement", "proven-provably-fast", "T3", "lower-bound"]

[metadata]
source = "https://starks.provably.fast/"
statement = "https://starks.provably.fast/MATHEMATICS.md"
target = "T3"
field = "babybear"
p = $p
m = $m
n = $n
k = $k
A = $A
floor = $floor
goal_per_n = $goal_per_n
max_listed = $max_listed
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/workspace"
env = { m = "$m" }

[verifier]
timeout_sec = $verifier_timeout
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/proven/pack_instance.py"
timeout_sec = 120
