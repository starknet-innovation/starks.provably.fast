  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink-2); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { position: relative; padding: 52px 64px; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(closest-side, color-mix(in srgb, var(--violet) 26%, transparent), transparent) 88% 46% / 620px 460px no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, var(--pink) 16%, transparent), transparent) 100% 8% / 460px 340px no-repeat; }
  body::after { content: ""; position: absolute; inset: 0; opacity: .45; background-image: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1px, transparent 1.2px);

  main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 360px; gap: 40px; height: 100%; }
  .left { display: grid; align-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 24px; font-weight: 600; color: var(--ink); }
  .brand .site { color: var(--violet); }
  .mark { width: 40px; height: 40px; }
  h1 { margin: 0; color: var(--ink); font-size: 72px; font-weight: 650; line-height: 1.02; letter-spacing: -.035em; }
  h1 em { font-style: normal; background: linear-gradient(92deg, var(--violet), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .prove { display: grid; gap: 10px; margin: 0; }
  .prove b { color: var(--ink); font-size: 30px; font-weight: 600; letter-spacing: -.015em; }
  .prove b span { color: var(--record); }
  .prove small { color: var(--muted); font-size: 19px; }
  .foot { display: flex; align-items: center; gap: 18px; margin: 0; font-size: 16px; color: var(--muted); }
  .foot b { color: var(--ink-2); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .foot .harbor { font: 500 18px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.01em; }
  .foot .lean { display: inline-flex; align-items: flex-start; gap: 2px; }
  .foot .lean svg { width: auto; height: 20px; fill: none; stroke: #386ee0; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .foot .lean sup { font-size: 10px; line-height: 1; }
  .right { display: grid; align-content: center; justify-items: center; gap: 22px; }
  .right img { width: 360px; height: auto; filter: drop-shadow(0 18px 40px color-mix(in srgb, var(--violet) 30%, transparent)); }
  .right p { margin: 0; color: var(--ink-2); font-size: 19px; text-align: center; line-height: 1.4; text-wrap: balance; }
</style>
